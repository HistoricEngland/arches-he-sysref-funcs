[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "arches-he-sysref-funcs"
description = "An Arches extension app providing additional system reference functions for Arches-based projects. Designed for easy integration with Historic England's Arches projects."
readme = {file = "README.md", content-type = "text/markdown"}
version = "1.1.0"
license = {text = "GNU AGPL3"}
authors = []
maintainers = [{name = "Historic England", email = "donotreply@historicengland.org.uk"}]
keywords = ["arches", "extension", "django", "heritage", "historic-data", "gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
requires-python = ">=3.10"
dependencies = [
    "arches>=7.6.17,<8.0.0",
]

[project.urls]
Homepage = "https://github.com/HistoricEngland/arches-he-sysref-funcs"
Repository = "https://github.com/HistoricEngland/arches-he-sysref-funcs.git"
Issues = "https://github.com/HistoricEngland/arches-he-sysref-funcs/issues"
Changelog = "https://github.com/HistoricEngland/arches-he-sysref-funcs/releases"

[project.optional-dependencies]
dev = [
    "livereload",
    "sst",
    "coverage",
    "django-silk==5.1.0",
    "pre-commit==3.8.0",
    "black==24.4.2",
]

[tool.setuptools.packages.find]
include = ["arches_he_sysref_funcs*"]
exclude = ["arches_he_sysref_funcs.logs*"]

[tool.setuptools]
include-package-data = true
